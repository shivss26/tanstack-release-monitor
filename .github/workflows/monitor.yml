name: release-monitor

# Layer 1 only. GitHub Actions is the sole GitHub writer; Work has read-only
# access to this metadata-only ledger and AgentMail holds delivery history.
on:
  workflow_dispatch:
    inputs:
      schedule:
        description: Expected UTC cron slot for a manual staging run
        required: true
        default: "30 14 * * *"
  schedule:
    # 00:00, 04:00, 08:00, 12:00, 16:00, 20:00 IST (UTC below).
    - cron: "30 18 * * *"
    - cron: "30 22 * * *"
    - cron: "30 2 * * *"
    - cron: "30 6 * * *"
    - cron: "30 10 * * *"
    - cron: "30 14 * * *"

permissions:
  contents: write

concurrency:
  group: release-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          # Conflict-safe retry may need the common ancestor with origin/main.
          fetch-depth: 0

      - name: Protect the production watermark from manual dispatch
        if: github.event_name == 'workflow_dispatch' && github.ref_name == 'main'
        run: |
          echo "Run manual collector checks from a staging branch, never main."
          exit 1

      - name: Choose publication mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "args=--dry-run" >> "$GITHUB_OUTPUT"
          else
            echo "args=" >> "$GITHUB_OUTPUT"
          fi

      - name: Establish collection identity
        id: collection
        run: echo "stamp=$(TZ=Asia/Kolkata date +%Y-%m-%d-%H%M)" >> "$GITHUB_OUTPUT"

      - name: Collect and validate one transactional bundle
        id: collect
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCHEDULE_CRON: ${{ github.event.schedule || inputs.schedule }}
          COLLECTION_TRIGGER: ${{ github.event_name }}
        run: |
          EXTRA_ARGS="${{ steps.mode.outputs.args }}"
          python3 monitor/collect.py \
            --stamp "${{ steps.collection.outputs.stamp }}" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --schedule "$SCHEDULE_CRON" \
            --trigger "$COLLECTION_TRIGGER" \
            $EXTRA_ARGS

      - name: Commit public collection bundle
        if: always() && github.event_name == 'schedule'
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git add state.json ledger
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "release-monitor[bot]"
          git config user.email "release-monitor@users.noreply.github.com"
          git commit -m "monitor: run $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 monitor/publish.py --repo . --attempts 3 --branch "$TARGET_BRANCH"

      - name: Mark collection failure
        if: steps.collect.outcome != 'success'
        run: exit 1
